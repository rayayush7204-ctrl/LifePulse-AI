version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/blood_donor_db
      - REDIS_URL=redis://redis:6379/0
      - USE_SQLITE_FALLBACK=False
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: blood_donor_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blood_donor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: blood_donor_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
