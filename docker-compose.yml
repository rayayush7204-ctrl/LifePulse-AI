
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # These three are set explicitly so compose variable substitution keeps
      # docker-compose.yml self-consistent. DATABASE_URL comes from .env directly.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - USE_SQLITE_FALLBACK=${USE_SQLITE_FALLBACK:-False}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: blood_donor_db
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-blood_donor_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-blood_donor_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  redis:
    image: redis:7-alpine
    container_name: blood_donor_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
